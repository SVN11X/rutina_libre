# Publica el catálogo y los medios revisados incluidos. Las fuentes no cambian sin revisión.
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar herramientas de pruebas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci
          npx playwright install --with-deps chromium

      - name: Reconstruir el catálogo revisado sin actualizar fuentes
        run: |
          npm run build:offline
          npm run audit:data

      - name: Regenerar esquemas originales
        run: node scripts/build-illustrations.mjs

      - name: Verificar catálogo, detector y rutinas
        run: npm test

      - name: Verificar medios y generar versión de caché
        run: |
          npm run check:media
          npm run stamp:release

      - name: Comprobar fotogramas, navegación, persistencia, PDF y uso sin conexión
        run: npm run test:browser

      - name: Preparar solo archivos del sitio
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js LICENSE README.md THIRD_PARTY.md _site/
          cp -R css js assets data licenses _site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
