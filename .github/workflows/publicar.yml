# Actualiza los datos de ejercicios y publica el sitio en GitHub Pages.
# Se ejecuta al subir cambios a main, cada lunes y cuando lo lanzas a mano desde la pestaña Actions.
name: Publicar sitio

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Actualizar datos de ejercicios
        # Si alguna fuente falla, se publica con los datos que ya están en el repositorio.
        continue-on-error: true
        run: node scripts/build-data.mjs

      - name: Regenerar esquemas originales
        run: node scripts/build-illustrations.mjs

      - name: Verificar catálogo, detector y rutinas
        run: node --test tests/app.test.mjs

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
