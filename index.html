<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Rutina Libre</title>
    <meta
      name="description"
      content="Ejercicios de fuerza, caminata, caminadora, velocidad y movilidad con fuentes, videos y GIF. Identifica un ejercicio por descripción o dibujo y crea tu rutina gratis."
    />
    <meta name="theme-color" content="#16212C" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta property="og:title" content="Rutina Libre" />
    <meta
      property="og:description"
      content="Ejercicios con fotos paso a paso y rutinas personalizadas para descargar en PDF."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://raw.githubusercontent.com" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/enhancements.css" />
    <link
      rel="preload"
      href="data/exercises.json"
      as="fetch"
      type="application/json"
      crossorigin
    />
  </head>
  <body>
    <a class="skip" href="#main">Saltar al contenido</a>

    <header class="top">
      <div class="wrap top__inner">
        <a class="brand" href="#/" aria-label="Rutina Libre, ir al inicio">
          <svg
            class="brand__mark"
            viewBox="0 0 32 32"
            width="30"
            height="30"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="16" cy="16" r="15" fill="var(--plate-yellow)" />
            <circle
              cx="16"
              cy="16"
              r="10.5"
              fill="none"
              stroke="var(--ink)"
              stroke-opacity=".25"
              stroke-width="1.5"
            />
            <circle cx="16" cy="16" r="3.5" fill="var(--bg)" />
          </svg>
          <span class="brand__name">Rutina Libre</span>
        </a>
        <nav class="nav" aria-label="Principal">
          <a href="#/" data-nav="ejercicios"
            ><svg
              class="nav__icon"
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" /></svg
            ><span>Ejercicios</span></a
          >
          <a href="#/identificar" data-nav="identificar"
            ><svg
              class="nav__icon"
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="m4 16 12-12 4 4-12 12H4v-4Z" />
              <path d="m13 7 4 4" /></svg
            ><span>Identificar</span></a
          >
          <a href="#/rutina" data-nav="rutina"
            ><svg
              class="nav__icon"
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M8 4h11v16H5V7z" />
              <path d="M9 10h7M9 14h7M9 18h4" /></svg
            ><span>Mi rutina</span
            ><span class="nav__count" data-routine-count hidden></span
          ></a>
          <a href="#/guardados" data-nav="guardados"
            ><svg
              class="nav__icon"
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M6 3h12v18l-6-4-6 4z" /></svg
            ><span>Guardados</span
            ><span class="nav__count" data-saved-count hidden></span
          ></a>
          <a href="#/acerca" data-nav="acerca"
            ><svg
              class="nav__icon"
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v6M12 7.5v.5" /></svg
            ><span>Fuentes</span></a
          >
        </nav>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <noscript>
        <div class="wrap page">
          <h1>Activa JavaScript</h1>
          <p>
            Esta página necesita JavaScript para buscar ejercicios y crear tu
            rutina.
          </p>
        </div>
      </noscript>
    </main>

    <footer class="foot">
      <div class="wrap foot__inner">
        <p>
          Rutina Libre usa datos abiertos y gratuitos.
          <a href="#/acerca">Ver fuentes y licencias</a>.
        </p>
        <p>
          Las recomendaciones son una guía general y no reemplazan a un
          profesional de la salud.
        </p>
      </div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
